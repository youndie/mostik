kotlin.code.style=official
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Kotlin/Native needs its own heap, and the default is small enough that a multi-target build spends
# its time in GC rather than in the compiler.
kotlin.native.jvmArgs=-Xmx3g

version=0.1.0

# WHAT THIS REPOSITORY TELLS THE SHARED CONVENTIONS.
#
# A template's group is the one thing every clone changes, so it is one line here and nowhere else.
sborka.group=io.github.youndie.keel
sborka.repository=youndie/keel
sborka.description=A template repository for a Kotlin server that ships twice.
sborka.inceptionYear=2026

# 25, AND THE NUMBER IS NOT KEEL'S TO CHOOSE. kore is compiled at 25 and a library published at 25
# cannot be consumed below it; zavarnik needs 25 or newer anyway, because the one-step training
# workflow is JEP 514. The two constraints agree, which is why this line has no argument attached.
sborka.jvmToolchain=25

# OFF, and deliberately, unlike every library in this portfolio.
#
# Explicit API is a published surface's discipline. keel publishes nothing and has no consumers: a
# clone renames it and writes its own code, so `public` on every declaration would be noise
# pretending to be rigour. kore's own sample declines it in as many words for the same reason.
sborka.explicitApi=false

# THE BINARY'S CEILING, enforced by razves — which `:server` applies itself, because a convention
# that carried it would put its jar on the build classpath of every repository taking any sborka
# convention, including the ones that ship no binary. A budget with no gate behind it fails the
# configuration rather than passing forever.
#
# THIS IS THE BINARY, NOT THE IMAGE. The brief's acceptance 2 — under 25 MB on distroless/cc, under
# 12 MB with STATIC=1 — is about the image and is measured by B-04. The two numbers are close only by
# coincidence: the runtime image carries the binary and nothing else, so they differ by the base.
# tracy's server binary is 13 863 696 bytes unstripped, which is the nearest measured figure and the
# reason this ceiling is where it is rather than at 12 or at 50.
sborka.binaryBudget=25MiB

# THE THIRD TARGET, OFF BY DEFAULT. `linuxArm64` doubles the native link time and nothing in this
# portfolio deploys there yet; a clone that does turns it on with -Pkeel.linuxArm64=true. Note that
# Kotlin/Native has no linux_arm64 host, so the target's test task is never CREATED — it does not
# show up as skipped, it does not show up at all. B-06 is how CI covers it anyway.
keel.linuxArm64=false
