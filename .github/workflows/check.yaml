# mostik's gate, from docs-bootstrap's templates/workflow-check.yaml for the default layout - `docs/`
# inside this repository - with the code gate beside it. The Makefile at the root is its other half.
#
# THE VERSION OF THE CHECKS IS WRITTEN HERE AND NOWHERE ELSE: the ref in the `uses:` lines below.
# CI runs the checks at that ref because the runner resolves it; the Makefile reads the same line
# and fetches the same ref for a local `make check`. Renovate's github-actions manager bumps it, so a
# release of the checks arrives as one pull request that moves CI and every laptop together. Both
# jobs name the same ref, and the Makefile refuses to guess when they do not.
#
# Do not replace the action with copied scripts to save a network fetch. That is how one portfolio
# came to hold 18 copies of one script in three versions, eleven of them missing a guard that had
# been fixed upstream for weeks.

name: check

# **No path filters.** A filter saves seconds and buys red default branches. Two changes that are
# each harmless alone disagree once merged; a generated index diverges from its sources when
# something outside the listed paths moves; and a document at the root of the tree is exactly the
# one nobody remembers to add to the list, so the check that would have caught it never runs.
# Sixty documents are checked in seconds. There is nothing here worth economising on.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"          # Monday morning, for the anchors job below
  workflow_dispatch:

jobs:
  # The gate. The action runs `make check` - exactly the target a contributor runs, so that "green
  # here, red there" cannot become the normal state of affairs - and around it the two checks that
  # depend on the event: on a pull request, backlog item numbers against the base branch, BEFORE the
  # gate; on a push to the default branch, `status: draft` as an error. Why each sits where it does,
  # and when the first is only a backstop, is written next to the step in the action's action.yml.
  #
  # Checks of the project's own belong in the Makefile under `gate`, not as steps here: then a
  # contributor runs them too. Steps that need a toolchain the gate should not (a JDK for a
  # formatter) go after this one, or in a job of their own.
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: youndie/docs-bootstrap@v0.3.8

  # THE CODE GATE. Until keel's B-06 there was none, and a pull request that did not compile was green —
  # which stopped being only a reviewer's problem when the loop began merging on green CI.
  build:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # BY NAME RATHER THAN BY COPY. Java, Gradle and the `~/.konan` cache in one step and at one
      # version; the portfolio ran three different versions of `setup-gradle` at once before this
      # action existed. The cache matters here specifically: the Kotlin/Native toolchain is around a
      # gigabyte and is fetched on every cold runner.
      #
      # BY TAG RATHER THAN `@main`. Every sborka publish tags the commit it built, `v<X.Y.Z.N>`, and
      # never moves the tag. At `@main` a merge to sborka changed this build with no pull request
      # here. At a tag the next sborka release arrives as Renovate's pull request, and this build runs
      # on it first. sborka's preset tells Renovate how to order a four-part tag (youndie/sborka#123).
      - uses: youndie/sborka/.github/actions/setup-kotlin@v0.5.0.126
        with:
          konan-cache: "true"

      # `make build`, not `./gradlew` directly, so the command a contributor runs and the command
      # that gates a pull request are one string in one place — the same reason the job above runs
      # `make check` rather than listing the scripts.
      - run: make build GRADLEFLAGS=--no-daemon

      # THE EXIT CODE IS NOT THE EVIDENCE. A suite that ran zero tests exits zero, and on a
      # multiplatform build the suite that silently does not run is the interesting one: `build` was
      # green for two items here while running no tests at all.
      #
      # So the targets are named rather than counted. `find | wc -l` passes when `linuxX64Test`
      # quietly stops being wired and the JVM suite carries the run on its own, which is the exact
      # shape of "a check that passes on one target and is skipped on the other" — the brief's red
      # list. Naming them means the failure says which one went missing.
      - name: report which suites actually ran
        if: always()
        run: |
          set -u
          fail=0
          for target in jvmTest linuxX64Test; do
            files=$(find server/build/test-results/"$target" -name '*.xml' 2>/dev/null | sort)
            if [ -z "$files" ]; then
              echo "::error::no test results for $target - that suite did not run"
              fail=1
              continue
            fi
            total=0
            for f in $files; do
              printf '%s ' "$f"
              grep -o 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f" || echo
              n=$(sed -n 's/.*<testsuite[^>]*tests="\([0-9]*\)".*/\1/p' "$f" | head -1)
              total=$((total + ${n:-0}))
            done
            echo "$target: $total tests"
            [ "$total" -gt 0 ] || { echo "::error::$target produced result files but ran zero tests"; fail=1; }
          done
          [ "$fail" = 0 ] || exit 1

      # NO arm64 SUITE HERE, unlike keel. kafkakn publishes no linuxArm64 variant (its backlog.md, "linuxArm64 is
      # not published and does not run in CI", the owner's decision of 2026-09-25), so `-Pmostik.linuxArm64=true`
      # fails at dependency resolution before anything compiles. The first push to GitHub found it: the local gate
      # this repository used until then never ran the step. It comes back when kafkakn publishes the target.

  # On a schedule, apart from the gate, because an anchor used to rot when somebody refactored a
  # **different** repository, and a red pull request nobody here caused is one people learn to
  # ignore. Every path outside this repository is now an address (SPEC 4.1) - inside a versioned
  # artefact or at a commit - which nothing elsewhere can move, so the report blocks: the Makefile
  # sets `ANCHORS_ARGS=--check`, and `make check` in the job above fails on a path of this
  # repository's own that resolves to nothing, in the pull request that broke it. This job runs the
  # same report on the default branch once a week.
  anchors:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The code lives in this checkout, so its parent is a directory whose one subdirectory is
      # this repository - which is exactly what REPOS (`..` by default) expects.
      - uses: youndie/docs-bootstrap@v0.3.8
        with:
          target: report

      # For a separate documentation repository, put shallow clones of the services next to the
      # step above and point REPOS at them. History is not needed - only the file tree - and a
      # repository that cannot be cloned is a warning rather than a failure, because its anchors are
      # simply unchecked.
      #
      # `secrets.GITHUB_TOKEN` is scoped to the repository running the workflow. That is enough for
      # public services; a private one needs a token that can read it, and with the default one it
      # will take the warning branch every week without ever saying why.
      #
      #   - run: |
      #       mkdir -p repos && cd repos
      #       for r in service-one service-two; do
      #         git clone --depth 1 --filter=blob:none --no-checkout \
      #           "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository_owner }}/$r.git" \
      #           || echo "::warning::$r is unreachable - its anchors were not checked"
      #       done
      #     env:
      #       GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   - uses: youndie/docs-bootstrap@v0.3.8
      #     with:
      #       target: report REPOS=repos
